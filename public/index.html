<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Productos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="absolute-body">

    <!-- ══════════════════════════════════════════
         SIDEBAR  (estructura fija, nunca cambia)
    ══════════════════════════════════════════ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon"><i class="bi bi-box-seam-fill"></i></div>
        <div>
          <div class="brand-name">StockPro</div>
          <div class="brand-sub">Panel de gestión</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>
        <a href="#" class="nav-item" data-page="brands">
          <i class="bi bi-bookmark-star"></i>
          <span>Marca</span>
          <span class="nav-badge" id="badge-brands">0</span>
        </a>
        <a href="#" class="nav-item" data-page="proveedores">
          <i class="bi bi-bookmark-star"></i>
          <span>Proveedor</span>
          <span class="nav-badge" id="badge-proveedores">0</span>
        </a>
        <a href="#" class="nav-item" data-page="storages">
          <i class="bi bi-building"></i>
          <span>Storage</span>
          <span class="nav-badge" id="badge-storages">0</span>
        </a>
        <a href="#" class="nav-item" data-page="models">
          <i class="bi bi-bookmark-star"></i>
          <span>Models</span>
          <span class="nav-badge" id="badge-models">0</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="d-flex align-items-center gap-2">
          <div class="avatar-xs"><i class="bi bi-person-fill"></i></div>
          <div>
            <div class="fw-600 text-sm">Administrador</div>
            <div class="text-muted" style="font-size:11px">Sistema v1.0</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ══════════════════════════════════════════
         MAIN CONTENT
    ══════════════════════════════════════════ -->

    <main class="main-content" id="mainContent">

      <header class="topbar">
        <button class="btn-toggle-sidebar" id="btnToggleSidebar">
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar-title" id="topbarTitle">Sistema de gestión de herramientas</div>
        <div class="topbar-actions">
          <div class="status-dot"></div>
          <span class="text-sm text-muted">Conectado</span>
        </div>
      </header>

      <!-- ════════════════════════════════════════
           CONTENEDOR DINÁMICO
           El router inyecta aquí el HTML de cada vista
      ════════════════════════════════════════ -->
      <div class="page-wrapper" id="pageContainer">
        <div class="d-flex justify-content-center align-items-center" style="height:60vh">
          <div class="spinner-custom"></div>
        </div>
      </div>

    </main>

    <!-- ══════════════════════════════════════════
         MODALES GLOBALES (compartidos entre módulos)
    ══════════════════════════════════════════ -->
    <div id="modalsContainer"></div>

    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Orden de carga: utilidades → router → módulos → arranque -->

  <script src="/js/utils.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/modules/dashboard.js"></script>
  <script src="/js/modules/brands.js"></script>
  <script src="/js/modules/models.js"></script>
  <script src="/js/modules/proveedores.js"></script>
  <script src="/js/modules/storages.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
