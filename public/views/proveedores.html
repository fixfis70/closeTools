<div class="page-header">
  <div>
    <h1 class="page-title">Providers</h1>
    <p class="page-subtitle">Manage providers</p>
  </div>
  <button class="btn-primary-action" id="btnNuevoProvider">
    <i class="bi bi-plus-lg"></i> New Provider
  </button>
</div>

<div class="search-bar-row">
  <div class="search-input-wrap">
    <i class="bi bi-search search-icon"></i>
    <input type="text" id="searchProvider" class="search-input" placeholder="Buscar proveedor…" />
  </div>
  <button class="btn-icon-outline" id="btnRefreshProvider" title="Recargar">
    <i class="bi bi-arrow-clockwise"></i>
  </button>
</div>

<div class="card-panel">
  <div class="table-responsive">
    <table class="table-custom">
      <thead>
      <tr>
        <th>#</th>
        <th>Provider</th>
        <th>Address</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody id="bodyProvider">
      <tr><td colspan="4" class="text-center py-5"><div class="spinner-custom"></div></td></tr>
      </tbody>
    </table>
  </div>
  <div class="table-footer">
    <span class="text-muted text-sm" id="totalProviderLabel">Loading…</span>
  </div>
</div>

<!-- MODAL PROVIDER -->
<div class="modal-overlay" id="modalProviderOverlay">
  <div class="modal-panel modal-sm">
    <div class="modal-header-custom">
      <div>
        <div class="modal-title-custom" id="modalProviderTitle">New Provider</div>
        <div class="modal-subtitle">Insert provider info</div>
      </div>
      <button class="btn-modal-close" id="btnCloseModalProvider">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="modal-body-custom">
      <form id="formProvider" novalidate>
        <input type="hidden" id="providerId" />

        <label class="form-label-custom">
          Provider <span class="required">*</span>
        </label>
        <input
                type="text"
                id="pNombre"
                class="input-custom"
                placeholder="Ej: Ferretería Central"
                maxlength="100"
                required
        />
        <div class="field-error" id="err-pNombre"></div>

        <label class="form-label-custom">
          Address <span class="required">*</span>
        </label>
        <input
                type="text"
                id="pAddress"
                class="input-custom"
                placeholder="Ej: Calle Principal #123"
                maxlength="150"
                required
        />
        <div class="field-error" id="err-pAddress"></div>
      </form>
    </div>

    <div class="modal-footer-custom">
      <button class="btn-cancel" id="btnCancelProvider">Cancel</button>
      <button class="btn-save" id="btnSaveProvider">
        <span id="btnSaveProviderText">
          <i class="bi bi-check-lg me-1"></i> Save
        </span>
        <span id="btnSaveProviderSpinner" class="d-none">
          <div class="spinner-sm"></div>
        </span>
      </button>
    </div>
  </div>
</div>
